<!DOCTYPE html>
<!--Pros:
1. upload any photo to edit
2. edit photo
3. responsive
4. download image after editing-->


<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
        <title>image editor</title>
    </head>

    <body>
        <div class="container">
            <div class="img">
                <div class="img-box">
                    <img id="img" >
                    <canvas id="canvas">
                        <!--msh h3rf a7amel el photo fa ba5od nos5a 
                        mnha fel canvas b3den a3mel download ll canvas-->

                    </canvas>
                </div>
                <div class="upload">
                    <label for="upload">upload</label>
                    <input type="file" id="upload">
                </div>

            </div>
            <div class="filters">
                <ul>
                    <li>
                        <label for="saturate">Saturate</label>
                        <input type="range" id="saturate"min="0" max="100" value="50">
                    </li>
                    <li>
                        <label for="contrast">Contrast</label>
                        <input type="range" id="contrast"min="0" max="100" value="50">
                    </li>
                    <li>
                        <label for="brightness">Brightness</label>
                        <input type="range" id="brightness"min="0" max="100" value="50">
                    </li>
                     <li>
                        <label for="sepia">Sepia</label>
                        <input type="range" id="sepia"min="0" max="100" value="0">
                    </li>
                     <li>
                        <label for="grayscale">Gray scale</label>
                        <input type="range" id="grayscale"min="0" step="0.1" max="1" value="0">
                    </li>
                     <li>
                        <label for="blur">Blur</label>
                        <input type="range" id="blur"min="0" step="0.1" max="10" value="0">
                    </li>
                    <li>
                        <label for="huerotate">Hue rotate</label>
                        <input type="range" id="huerotate"min="0" max="350" value="0">
                    </li>
                    <li>
                        <a download="true" id="download">Download</a>
                        <span onclick="resetValue()">Reset</span>
                    </li>
                    
                </ul>

            </div>
        </div>
        <script src="main.js"></script>
    </body>
    

</html>
